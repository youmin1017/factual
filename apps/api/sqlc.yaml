version: "2"
# One entry per domain: its SQL in internal/domain/<name>/queries/*.sql becomes
# its private package internal/domain/<name>/internal/db, which no other
# package can import. The schema is the goose migrations themselves.
sql:
  - name: identity
    engine: postgresql
    schema: db/migrations
    queries: internal/domain/identity/queries
    gen:
      go:
        package: db
        out: internal/domain/identity/internal/db
        sql_package: pgx/v5
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
  - name: ledger
    engine: postgresql
    schema: db/migrations
    queries: internal/domain/ledger/queries
    gen:
      go:
        package: db
        out: internal/domain/ledger/internal/db
        sql_package: pgx/v5
        omit_unused_structs: true
        emit_enum_valid_method: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: date
            go_type: time.Time
