openapi: 3.0.3
info:
  title: Factual API
  version: 0.5.0
  description: |
    The API is spec-first: this file is the source of truth for the Go server
    (oapi-codegen) and the web client types (openapi-typescript).

    Access control: every operation declares exactly one `x-auth`:
    `public`, `authenticated` (any logged-in user) or `admin` (instance
    admin). The API does not start otherwise. Operations inside a budget
    also declare `x-budget: read | write | manage`, the permission the
    caller's role in that budget must grant. Errors use the `Error` envelope.
servers:
  - url: /api
tags:
  - name: system
  - name: auth
  - name: ledger
  - name: calendar
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Whether the API is up and can reach its database
      x-auth: public
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  # --- Sessions ---
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with username and password
      description: Creates a session and sets the session cookie.
      x-auth: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      description: Always succeeds; clears the session cookie.
      x-auth: public
      responses:
        '204':
          description: Logged out
          headers:
            Set-Cookie:
              schema:
                type: string

  # --- OpenID Connect. The browser navigates to the flow endpoints (no
  # fetch); results come back as redirects to web pages with ?error=<code>.
  /auth/oidc/providers:
    get:
      operationId: listLoginProviders
      tags: [auth]
      summary: Enabled identity providers for the login page
      x-auth: public
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoginProvider'
  /auth/oidc/{code}/login:
    parameters:
      - $ref: '#/components/parameters/ProviderCode'
      - $ref: '#/components/parameters/Redirect'
    get:
      operationId: startOidcLogin
      tags: [auth]
      summary: Start logging in with an identity provider
      description: Sets the flow cookie and redirects to the IdP (or to /login?error=...).
      x-auth: public
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
  /auth/oidc/{code}/link:
    parameters:
      - $ref: '#/components/parameters/ProviderCode'
    get:
      operationId: startOidcLink
      tags: [auth]
      summary: Start linking an identity to the logged-in user
      description: Sets the flow cookie and redirects to the IdP (or to /profile?error=...).
      x-auth: authenticated
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: Redirect target of every identity provider
      description: |
        Completes the flow from the flow cookie. Login: sets the session cookie
        and redirects to the requested page, or to /login?error=<code>. Link:
        redirects to /profile?linked=<provider> or /profile?error=<code>.
      x-auth: public
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by the IdP when the user cancelled or the request failed.
          schema:
            type: string
      responses:
        '302':
          $ref: '#/components/responses/Redirect'

  # --- Identity provider settings (instance admin) ---
  /oidc-providers:
    get:
      operationId: listOidcProviders
      tags: [auth]
      summary: Identity providers (client secrets are never returned)
      x-auth: admin
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProviderList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createOidcProvider
      tags: [auth]
      summary: Add an identity provider (the issuer must serve OIDC discovery)
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcProviderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProvider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /oidc-providers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateOidcProvider
      tags: [auth]
      summary: Update an identity provider (an empty clientSecret keeps the stored one)
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcProviderInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProvider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteOidcProvider
      tags: [auth]
      summary: Delete an identity provider (its linked identities are removed)
      x-auth: admin
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # --- The logged-in user ---
  /me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The logged-in user
      x-auth: authenticated
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/password:
    put:
      operationId: changePassword
      tags: [auth]
      summary: Set or change the logged-in user's password
      description: |
        `currentPassword` is required when the user already has a password.
        Other sessions of the user are ended; the current one stays.
      x-auth: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/identities:
    get:
      operationId: listMyIdentities
      tags: [auth]
      summary: Identities the logged-in user linked
      x-auth: authenticated
      responses:
        '200':
          description: Linked identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkedIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/identities/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      operationId: unlinkMyIdentity
      tags: [auth]
      summary: Unlink one of the logged-in user's identities
      description: Refused when it is the user's last way to log in (no password, no other identity).
      x-auth: authenticated
      responses:
        '204':
          description: Unlinked
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/preferences:
    get:
      operationId: getPreferences
      tags: [auth]
      summary: The logged-in user's preferences
      x-auth: authenticated
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updatePreferences
      tags: [auth]
      summary: Replace the logged-in user's preferences
      x-auth: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # --- Budgets. Operations inside a budget declare `x-budget`: the
  # permission the caller's role in that budget must grant (ADR-017).
  /budgets:
    get:
      operationId: listBudgets
      tags: [ledger]
      summary: Budgets the caller is a member of
      x-auth: authenticated
      responses:
        '200':
          description: Budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createBudget
      tags: [ledger]
      summary: Create a budget owned by the caller
      description: The first budget a user creates becomes their default one.
      x-auth: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          $ref: '#/components/responses/BadRequest'
  /budgets/{budgetId}:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    get:
      operationId: getBudget
      tags: [ledger]
      summary: One budget
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: Budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateBudget
      tags: [ledger]
      summary: Rename a budget
      x-auth: authenticated
      x-budget: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/summary:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    get:
      operationId: getBudgetSummary
      tags: [ledger]
      summary: Totals of a budget
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /budgets/{budgetId}/months/{month}:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/Month'
    get:
      operationId: getBudgetMonth
      tags: [ledger]
      summary: The envelopes of one month (ADR-025, ADR-026)
      description: |
        One line per expense category that has money budgeted or spent up to
        the end of the month, as recorded on that category; the client folds
        the subcategories of a pooled parent into the parent's envelope
        (ADR-061). The pool is not per month: it is everything not given to
        an envelope, in any month.
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: The month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetMonth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/months/{month}/allocations:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/Month'
    put:
      operationId: setAllocations
      tags: [ledger]
      summary: Set how much the pool gives each envelope in a month
      description: |
        Each amount replaces the envelope's allocation for the month (0
        removes it; negative gives money back to the pool). Only envelopes
        take allocations: expense categories that are pooled or have no
        subcategories, and are not inside a pooled parent. All or nothing.
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationBatch'
      responses:
        '204':
          description: Set
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Accounts
  /budgets/{budgetId}/accounts:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    get:
      operationId: listAccounts
      tags: [ledger]
      summary: Accounts of a budget with their balances
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createAccount
      tags: [ledger]
      summary: Add an account, with its opening balance
      x-auth: authenticated
      x-budget: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /budgets/{budgetId}/accounts/order:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    put:
      operationId: reorderAccounts
      tags: [ledger]
      summary: Set the order of accounts
      description: Accounts are shown in the order of `ids`; accounts not listed keep their place after them.
      x-auth: authenticated
      x-budget: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reorder'
      responses:
        '204':
          description: Reordered
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/AccountId'
    put:
      operationId: updateAccount
      tags: [ledger]
      summary: Rename, close or reopen an account
      x-auth: authenticated
      x-budget: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteAccount
      tags: [ledger]
      summary: Delete an account that has no transactions besides its opening balance
      x-auth: authenticated
      x-budget: manage
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # --- Categories
  /budgets/{budgetId}/categories:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    get:
      operationId: listCategories
      tags: [ledger]
      summary: Categories of a budget (flat; build the tree from parentId)
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createCategory
      tags: [ledger]
      summary: Add a category (at most three levels; children take their parent's kind)
      x-auth: authenticated
      x-budget: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /budgets/{budgetId}/categories/order:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    put:
      operationId: reorderCategories
      tags: [ledger]
      summary: Set the order of the categories under one parent
      x-auth: authenticated
      x-budget: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reorder'
      responses:
        '204':
          description: Reordered
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/CategoryId'
    put:
      operationId: updateCategory
      tags: [ledger]
      summary: Rename, archive, or share one envelope among the children
      x-auth: authenticated
      x-budget: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteCategory
      tags: [ledger]
      summary: Delete an unused category (archive it otherwise)
      x-auth: authenticated
      x-budget: manage
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /budgets/{budgetId}/categories/{categoryId}/move:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/CategoryId'
    post:
      operationId: moveCategory
      tags: [ledger]
      summary: Move a category, with its subcategories, under another parent
      description: |
        The new parent has the same kind, and the tree stays at most three
        levels deep (ADR-027). Transactions and allocations stay with the
        category; moving it into a parent that shares its budget folds its
        money into that envelope (ADR-061).
      x-auth: authenticated
      x-budget: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryMove'
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # --- Transactions (M4: the account register and :w)
  /budgets/{budgetId}/accounts/{accountId}/register:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: getRegister
      tags: [ledger]
      summary: Every transaction touching an account, with all of their entries
      description: Oldest first. Balances are computed by the client from the entries.
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/accounts/{accountId}/statements:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: listStatements
      tags: [ledger]
      summary: A credit card's statements (ADR-088, ADR-089)
      description: |
        The open statement and the closed ones, newest first. A card
        without statement settings has none (404 for an account that is
        not a credit card).
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: Statements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardStatements'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/accounts/{accountId}/billing:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/AccountId'
    put:
      operationId: setBilling
      tags: [ledger]
      summary: Move entries out of the latest statement, or back in (:defer)
      description: |
        `billed: false` takes the card's entries of these transactions out
        of its latest closed statement, so the next closing bills them (a
        charge the bank billed a month later); `billed: true` puts unbilled
        ones dated up to its closing day back in (ADR-088).
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingChange'
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/accounts/{accountId}/loan:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: getLoan
      tags: [ledger]
      summary: A loan's terms, where it stands and its table (ADR-096..098)
      description: |
        404 for an account that is not a loan or whose terms are not set.
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: The loan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanDetails'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: setLoan
      tags: [ledger]
      summary: Set a loan account's terms
      description: |
        Saves the terms and its rates, and the schedule that pays it when it
        has an account to pay from (ADR-097). The first time, the loan is
        tracked from the first payment after today, and an account with no
        entries gets an opening balance of what the terms leave owed then
        (ADR-098); setting terms again keeps that day. Problems carry the
        field in `details.field`.
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanTerms'
      responses:
        '200':
          description: The loan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteLoan
      tags: [ledger]
      summary: Remove a loan's terms and its schedule; posted payments stay
      x-auth: authenticated
      x-budget: write
      responses:
        '204':
          description: Removed
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/accounts/{accountId}/loan/preview:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: previewLoan
      tags: [ledger]
      summary: The table terms would give, without saving them
      x-auth: authenticated
      x-budget: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanTerms'
      responses:
        '200':
          description: The table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/accounts/{accountId}/loan/align:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: alignLoan
      tags: [ledger]
      summary: Align what the loan owes on a day with what the bank shows (ADR-098)
      description: |
        Posts the difference on the loan account alone (payee 貸款調整, no
        category), so neither the pool nor an envelope changes; nothing when
        they already agree. Later periods are computed from the aligned
        balance.
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanAlign'
      responses:
        '200':
          description: Aligned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanAligned'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/statements/{statementId}/due:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - name: statementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setStatementDue
      tags: [ledger]
      summary: Align a closed statement's amount with the bank's bill
      description: |
        `amount` replaces what the statement asks for; null goes back to the
        computed amount (ADR-088).
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementDue'
      responses:
        '204':
          description: Set
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/register:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    get:
      operationId: getScopeRegister
      tags: [ledger]
      summary: Transactions on a group of accounts, oldest first
      description: |
        Every transaction with an entry on an account in the scope: all
        accounts, the budget accounts, or the tracking accounts (ADR-071).
        Each comes with all of its entries, as in an account's register.
      x-auth: authenticated
      x-budget: read
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/RegisterScope'
      responses:
        '200':
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/payees:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    get:
      operationId: listPayees
      tags: [ledger]
      summary: Payees, with the category last used for each
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: Payees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payee'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/payees/{payeeId}:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/PayeeId'
    put:
      operationId: renamePayee
      tags: [ledger]
      summary: Rename a payee
      description: Answers 409 `payee_exists` when another payee has the name; merge them instead.
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayeeUpdate'
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deletePayee
      tags: [ledger]
      summary: Delete a payee no transaction or schedule uses
      x-auth: authenticated
      x-budget: write
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /budgets/{budgetId}/payees/{payeeId}/merge:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/PayeeId'
    post:
      operationId: mergePayees
      tags: [ledger]
      summary: Merge other payees into this one
      description: |
        Transactions and schedules of the source payees move to this payee,
        then the sources are deleted, in one database transaction.
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayeeMerge'
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/transactions/batch:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    post:
      operationId: saveTransactions
      tags: [ledger]
      summary: Apply an editor buffer in one database transaction (:w)
      description: |
        Upserts are keyed by the client-generated transaction id (ADR-021):
        an unknown id creates the transaction, a known one replaces its date,
        payee, note and entries. Payees are given by name and created when
        missing. Either everything is applied or nothing is, and every problem
        found is reported against the transaction it belongs to (ADR-044).
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionBatch'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSaved'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Nothing was saved; the transactions listed have problems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrors'
  /budgets/{budgetId}/transactions/reviewed:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    post:
      operationId: markReviewed
      tags: [ledger]
      summary: Confirm transactions that need review (:review)
      description: |
        Clears `needsReview` on the transactions given (a schedule posted
        them with an estimated amount, ADR-085). Ids that are not in the
        budget or need no review are ignored. Saving a transaction through
        the batch endpoint confirms it too.
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionIds'
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reviewed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Schedules (M9, ADR-084..086)
  /budgets/{budgetId}/schedules:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    get:
      operationId: listSchedules
      tags: [ledger]
      summary: The budget's schedules, oldest first
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/schedules/batch:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    post:
      operationId: saveSchedules
      tags: [ledger]
      summary: Apply the schedules page's buffer in one database transaction (:w)
      description: |
        Upserts are keyed by the client-generated schedule id. Editing a
        schedule changes every occurrence not yet posted; posted ones stay as
        they are. Occurrences of the saved schedules that are already due are
        posted before the response (ADR-085). All or nothing, with problems
        reported per schedule (ADR-044).
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleBatch'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleBatchSaved'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Nothing was saved; the schedules listed have problems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrors'
  /budgets/{budgetId}/schedules/upcoming:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    get:
      operationId: listUpcoming
      tags: [ledger]
      summary: Occurrences not yet posted, up to a date (預定 rows, ADR-085)
      description: |
        Every occurrence of an active schedule that is neither posted nor
        skipped and is posted on or before `until` (after moving off days
        off), earliest first.
      x-auth: authenticated
      x-budget: read
      parameters:
        - name: until
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Occurrences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Occurrence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/schedules/{scheduleId}/skips:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: skipOccurrence
      tags: [ledger]
      summary: Skip one occurrence (:skip)
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccurrenceRef'
      responses:
        '204':
          description: Skipped
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /budgets/{budgetId}/schedules/{scheduleId}/skips/{occurrence}:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/ScheduleId'
      - name: occurrence
        in: path
        required: true
        schema:
          type: string
          format: date
    delete:
      operationId: unskipOccurrence
      tags: [ledger]
      summary: Bring a skipped occurrence back (:unskip)
      x-auth: authenticated
      x-budget: write
      responses:
        '204':
          description: Brought back
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/schedules/{scheduleId}/post:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: postOccurrence
      tags: [ledger]
      summary: Post one occurrence now, as it is (:post)
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccurrenceRef'
      responses:
        '200':
          description: Posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Posted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /budgets/{budgetId}/categories/{categoryId}/base:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/CategoryId'
    put:
      operationId: setCategoryBase
      tags: [ledger]
      summary: Set an envelope's base amount per month (:base, ADR-086)
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryBase'
      responses:
        '204':
          description: Set
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/goals:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    get:
      operationId: listGoals
      tags: [ledger]
      summary: The budget's goals in priority order, with what each has saved (ADR-092, ADR-094)
      description: |
        Every goal, achieved and archived ones included, in priority order,
        with what it has saved today (its envelope's balance handed down the
        envelope's open goals in that order) and what it asks this month
        (ADR-093). Also what the page needs to project when each goal is
        reached: the budget's average monthly spending, its typical monthly
        income, this month's targets without goals and the envelopes'
        balances.
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: Goals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalList'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/goals/batch:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    post:
      operationId: saveGoals
      tags: [ledger]
      summary: Apply the goals page's buffer in one database transaction (:w)
      description: |
        Upserts are keyed by the client-generated goal id. All or nothing,
        with problems reported per goal (ADR-044).
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalBatch'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalBatchSaved'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Nothing was saved; the goals listed have problems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrors'

  # --- Days off (ADR-087)
  /holidays:
    get:
      operationId: getHolidays
      tags: [calendar]
      summary: Days off between two years
      description: |
        The years with an imported calendar, and the days of those years
        that differ from "Saturdays and Sundays are off" or carry a note.
        Days of other years follow the weekend rule.
      x-auth: authenticated
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: to
          in: query
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The calendar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayCalendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /holidays/years:
    get:
      operationId: listHolidayYears
      tags: [calendar]
      summary: The imported years
      x-auth: admin
      responses:
        '200':
          description: Years
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HolidayYear'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /holidays/import:
    post:
      operationId: importHolidays
      tags: [calendar]
      summary: Import the government's office calendar from a URL or a CSV text
      description: |
        The official CSV (西元日期,星期,是否放假,備註; UTF-8 with or without
        BOM; 2 = off, 0 = working). Every year in it is replaced. A URL is
        fetched by the server (http or https, at most 1 MB) and kept so the
        year can be fetched again.
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolidayImport'
      responses:
        '200':
          description: The years imported
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HolidayYear'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /holidays/years/{year}:
    parameters:
      - name: year
        in: path
        required: true
        schema:
          type: integer
          format: int32
    delete:
      operationId: deleteHolidayYear
      tags: [calendar]
      summary: Forget a year (its days follow the weekend rule again)
      x-auth: admin
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    BudgetId:
      name: budgetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Month:
      name: month
      in: path
      required: true
      description: A calendar month, YYYY-MM.
      schema:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PayeeId:
      name: payeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderCode:
      name: code
      in: path
      required: true
      schema:
        type: string
    Redirect:
      name: redirect
      in: query
      description: App path to land on after login (must start with /).
      schema:
        type: string
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `not_found`, `unauthorized`.
        message:
          type: string
          description: Human-readable message.
        details:
          type: object
          additionalProperties: true

    # --- Auth ---
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 256
          description: Empty when the user has no password yet.
        newPassword:
          type: string
          minLength: 8
          maxLength: 256
    CurrentUser:
      type: object
      required: [id, username, displayName, email, isAdmin, hasPassword]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
          description: Instance admin; may manage identity providers.
        hasPassword:
          type: boolean
          description: Whether the user can log in with a password.
    Preferences:
      type: object
      required: [editorKeymap]
      properties:
        editorKeymap:
          type: string
          maxLength: 8000
          description: |
            Key mappings for the editors in vimrc form (`inoremap jk <Esc>`,
            `nnoremap H 0`, `let mapleader = ","`). Parsed by the web app;
            the server only stores it.
    LoginProvider:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    OidcProvider:
      type: object
      required: [id, code, name, issuer, clientId, hasSecret, scopes, sort, enabled, remark, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        issuer:
          type: string
        clientId:
          type: string
        hasSecret:
          type: boolean
          description: Whether a client secret is stored (it is never returned).
        scopes:
          type: string
        sort:
          type: integer
          format: int32
        enabled:
          type: boolean
        remark:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OidcProviderInput:
      type: object
      required: [code, name, issuer, clientId, clientSecret, scopes, sort, enabled, remark]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_-]{1,31}$'
          description: Used in URLs, e.g. `google`.
        name:
          type: string
          minLength: 1
          maxLength: 64
        issuer:
          type: string
          minLength: 1
          maxLength: 255
        clientId:
          type: string
          minLength: 1
          maxLength: 255
        clientSecret:
          type: string
          maxLength: 2048
          description: Empty on update keeps the stored secret.
        scopes:
          type: string
          maxLength: 255
        sort:
          type: integer
          format: int32
        enabled:
          type: boolean
        remark:
          type: string
          maxLength: 255
    OidcProviderList:
      type: object
      required: [items, callbackUrl, encryptionConfigured]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OidcProvider'
        callbackUrl:
          type: string
          description: Redirect URI to register at every identity provider.
        encryptionConfigured:
          type: boolean
          description: Whether FACTUAL_ENCRYPTION_KEY is set; OIDC login needs it.
    LinkedIdentity:
      type: object
      required: [id, providerCode, providerName, email, createdAt, lastLoginAt]
      properties:
        id:
          type: string
          format: uuid
        providerCode:
          type: string
        providerName:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    # --- Ledger. Amounts are integers in the budget's minor unit (minorUnits
    # digits after the decimal point; 0 for TWD).
    BudgetRole:
      type: string
      enum: [owner, editor, viewer]
    Budget:
      type: object
      required: [id, name, currency, minorUnits, role, isDefault, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
          description: ISO 4217 code, e.g. TWD.
        minorUnits:
          type: integer
          format: int32
          description: Digits after the decimal point in amounts of this budget.
        role:
          $ref: '#/components/schemas/BudgetRole'
        isDefault:
          type: boolean
          description: The caller's default budget (shared expenses land here).
        createdAt:
          type: string
          format: date-time
    BudgetCreate:
      type: object
      required: [name, currency, starterCategories]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        starterCategories:
          type: boolean
          description: Create a common set of categories to start from.
    BudgetUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
    BudgetSummary:
      type: object
      required: [pool, envelopeBalance, onBudgetBalance, offBudgetBalance]
      properties:
        pool:
          type: integer
          format: int64
          description: Money not yet given to any envelope.
        envelopeBalance:
          type: integer
          format: int64
          description: |
            What all envelopes hold together: every allocation plus every
            expense recorded in a category. The on-budget accounts always
            sum to pool + envelopeBalance (ADR-020).
        onBudgetBalance:
          type: integer
          format: int64
          description: Sum of the on-budget accounts.
        offBudgetBalance:
          type: integer
          format: int64
          description: Sum of the tracking (off-budget) accounts.
    BudgetMonth:
      type: object
      required: [month, pool, income, envelopes, incomes, targets, spokenFor]
      properties:
        month:
          type: string
          description: YYYY-MM
        pool:
          type: integer
          format: int64
          description: Money not given to any envelope in any month (ADR-025).
        income:
          type: integer
          format: int64
          description: Income recorded in the month (it went to the pool).
        envelopes:
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeMonth'
        incomes:
          type: array
          description: Income recorded in the month per income category (only those with any).
          items:
            $ref: '#/components/schemas/IncomeMonth'
        targets:
          type: array
          description: |
            The month's target of every envelope that has one: its base plus
            what the schedules it covers ask for (ADR-086), keyed by the
            envelope (a pooled parent for its subcategories' schedules).
          items:
            $ref: '#/components/schemas/EnvelopeTarget'
        spokenFor:
          type: array
          description: |
            Per envelope, the money it holds at the end of the month that is
            not free to move (ADR-095): what its schedules have set aside for
            occurrences still to come, and what its goals have saved from the
            rest. Envelopes with neither are left out.
          items:
            $ref: '#/components/schemas/SpokenFor'
    SpokenFor:
      type: object
      required: [categoryId, schedules, goals]
      properties:
        categoryId:
          type: string
          format: uuid
          description: The envelope.
        schedules:
          type: integer
          format: int64
          description: Set aside for its schedules' occurrences not posted yet.
        goals:
          type: integer
          format: int64
          description: What its goals have saved.
    IncomeMonth:
      type: object
      required: [categoryId, received]
      properties:
        categoryId:
          type: string
          format: uuid
        received:
          type: integer
          format: int64
    EnvelopeMonth:
      type: object
      required: [categoryId, allocated, activity, carried]
      properties:
        categoryId:
          type: string
          format: uuid
        allocated:
          type: integer
          format: int64
          description: Given from the pool this month.
        activity:
          type: integer
          format: int64
          description: Recorded in the category this month (negative = spent).
        carried:
          type: integer
          format: int64
          description: |
            Balance at the start of the month: every earlier allocation and
            activity, positive or negative (ADR-026). The balance at the end
            is carried + allocated + activity.
    AllocationBatch:
      type: object
      required: [allocations]
      properties:
        allocations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/AllocationInput'
    AllocationInput:
      type: object
      required: [categoryId, amount]
      properties:
        categoryId:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
    AccountKind:
      type: string
      enum: [cash, bank, credit_card, loan, investment]
    Account:
      type: object
      required: [id, name, kind, onBudget, closed, sortOrder, balance, clearedBalance, hasActivity, card]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/AccountKind'
        onBudget:
          type: boolean
        closed:
          type: boolean
        sortOrder:
          type: integer
          format: int32
        balance:
          type: integer
          format: int64
        clearedBalance:
          type: integer
          format: int64
        hasActivity:
          type: boolean
          description: Whether the account has transactions besides its opening balance (it then cannot be deleted).
        card:
          allOf:
            - $ref: '#/components/schemas/CardSettings'
          nullable: true
          description: A credit card's statement settings; null for other accounts and cards without them.
    CardSettings:
      type: object
      required: [statementDay, dueDay, creditLimit, autopayAccountId]
      properties:
        statementDay:
          type: integer
          format: int32
          minimum: 1
          maximum: 31
          description: 結帳日; a month without that day closes on its last day.
        dueDay:
          type: integer
          format: int32
          minimum: 1
          maximum: 31
          description: 繳款截止日; in the month after the statement day when it is not later than it.
        creditLimit:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        autopayAccountId:
          type: string
          format: uuid
          nullable: true
          description: The account the card is paid from on the due date (ADR-090).
    AccountCreate:
      type: object
      required: [name, kind, onBudget, openingBalance, openingDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          $ref: '#/components/schemas/AccountKind'
        onBudget:
          type: boolean
          description: Ignored for credit cards (always on budget), loans and investments (never).
        openingBalance:
          type: integer
          format: int64
          description: Balance on openingDate; negative for money owed (a credit card, a loan).
        openingDate:
          type: string
          format: date
        card:
          $ref: '#/components/schemas/CardSettings'
    AccountUpdate:
      type: object
      required: [name, closed]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        closed:
          type: boolean
          description: A closed account is hidden from pickers; it must have a zero balance.
        card:
          $ref: '#/components/schemas/CardSettings'
    StatementState:
      type: string
      enum: [due, partial, paid, overdue, settled]
      description: |
        待繳, 部分繳款, 已繳清, 逾期; `settled` for a statement a newer one
        includes (ADR-089).
    Statement:
      type: object
      required: [id, periodStart, periodEnd, dueDate, previousDue, charges, payments, amountDue, computedDue, adjusted, paid, remaining, state]
      properties:
        id:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
          description: The statement day.
        dueDate:
          type: string
          format: date
        previousDue:
          type: integer
          format: int64
          description: What the statement before asked for (0 for the first).
        charges:
          type: integer
          format: int64
          description: Spending billed in it, less refunds (positive is spent).
        payments:
          type: integer
          format: int64
          description: Payments billed in it (made before it closed).
        amountDue:
          type: integer
          format: int64
          description: What it asks for, aligned by hand or computed.
        computedDue:
          type: integer
          format: int64
          description: The card's outstanding balance over every billed entry at its closing, never below zero.
        adjusted:
          type: boolean
          description: amountDue was typed to match the bank's bill.
        paid:
          type: integer
          format: int64
          description: Payments made after it closed (the latest statement only; 0 for settled ones).
        remaining:
          type: integer
          format: int64
        state:
          $ref: '#/components/schemas/StatementState'
    OpenStatement:
      type: object
      required: [id, periodStart, periodEnd, dueDate, charges, payments]
      properties:
        id:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        charges:
          type: integer
          format: int64
          description: Spending not billed yet, less refunds (positive is spent).
        payments:
          type: integer
          format: int64
          description: Payments not billed yet.
    CardStatements:
      type: object
      required: [card, open, statements]
      properties:
        card:
          allOf:
            - $ref: '#/components/schemas/CardSettings'
          nullable: true
        open:
          allOf:
            - $ref: '#/components/schemas/OpenStatement'
          nullable: true
        statements:
          type: array
          description: Closed statements, newest first.
          items:
            $ref: '#/components/schemas/Statement'
    BillingChange:
      type: object
      required: [transactionIds, billed]
      properties:
        transactionIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
        billed:
          type: boolean
    BillingChanged:
      type: object
      required: [changed, statementId]
      properties:
        changed:
          type: integer
          format: int32
          description: Entries moved.
        statementId:
          type: string
          format: uuid
          description: The latest closed statement.
    StatementDue:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
    CategoryKind:
      type: string
      enum: [expense, income]
    Category:
      type: object
      required: [id, parentId, name, kind, pooled, isSystem, sortOrder, archived, budgetBase]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        kind:
          $ref: '#/components/schemas/CategoryKind'
        pooled:
          type: boolean
          description: The subcategories share this category's budget (its envelope).
        isSystem:
          type: boolean
          description: Created by the app (e.g. opening balances); cannot be changed.
        sortOrder:
          type: integer
          format: int32
        archived:
          type: boolean
        budgetBase:
          type: integer
          format: int64
          nullable: true
          description: The envelope's base amount per month (ADR-086).
    CategoryCreate:
      type: object
      required: [parentId, name, kind]
      properties:
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 32
        kind:
          $ref: '#/components/schemas/CategoryKind'
        pooled:
          type: boolean
          description: Defaults to true for expense categories (ADR-061); income categories never pool.
    CategoryUpdate:
      type: object
      required: [name, pooled, archived]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
        pooled:
          type: boolean
        archived:
          type: boolean
    CategoryMove:
      type: object
      required: [parentId, index]
      properties:
        parentId:
          type: string
          format: uuid
          nullable: true
          description: The new parent; null for the top level.
        index:
          type: integer
          format: int32
          minimum: 0
          description: Position among the new siblings of the same kind (past the end = last).
    Reorder:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
    RegisterScope:
      type: string
      enum: [all, onBudget, offBudget]
    ClearedState:
      type: string
      enum: [uncleared, cleared, reconciled]
    Entry:
      type: object
      required: [id, accountId, categoryId, amount, memo, cleared]
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: integer
          format: int64
          description: Change in the account's balance.
        memo:
          type: string
        cleared:
          $ref: '#/components/schemas/ClearedState'
        statementId:
          type: string
          format: uuid
          nullable: true
          description: The card statement the entry is billed in (ADR-088); null or absent when not billed.
    Transaction:
      type: object
      required: [id, date, payeeId, payeeName, note, needsReview, isOpening, entries]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        payeeId:
          type: string
          format: uuid
          nullable: true
        payeeName:
          type: string
          nullable: true
        note:
          type: string
        needsReview:
          type: boolean
        isOpening:
          type: boolean
          description: The opening balance of an account.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
    Payee:
      type: object
      required: [id, name, lastCategoryId, transactionCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lastCategoryId:
          type: string
          format: uuid
          nullable: true
          description: The category of the payee's most recent categorized entry, to fill in new rows.
        transactionCount:
          type: integer
          format: int32
    PayeeUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
    PayeeMerge:
      type: object
      required: [sourceIds]
      properties:
        sourceIds:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            format: uuid
    EntryInput:
      type: object
      required: [accountId, categoryId, amount, memo, cleared]
      properties:
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: integer
          format: int64
        memo:
          type: string
          maxLength: 255
        cleared:
          $ref: '#/components/schemas/ClearedState'
    TransactionInput:
      type: object
      required: [id, date, payee, note, entries]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        payee:
          type: string
          maxLength: 64
          description: Payee name; empty for none (e.g. a transfer). Created when it does not exist.
        note:
          type: string
          maxLength: 255
        entries:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/EntryInput'
        occurrence:
          $ref: '#/components/schemas/ScheduledOccurrence'
    TransactionBatch:
      type: object
      required: [upserts, deletes]
      properties:
        upserts:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/TransactionInput'
        deletes:
          type: array
          maxItems: 2000
          items:
            type: string
            format: uuid
    TransactionIds:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            type: string
            format: uuid
    Reviewed:
      type: object
      required: [reviewed]
      properties:
        reviewed:
          type: integer
          format: int32
          description: Transactions that needed review and no longer do.
    BatchSaved:
      type: object
      required: [upserted, deleted]
      properties:
        upserted:
          type: integer
          format: int32
        deleted:
          type: integer
          format: int32
    BatchProblem:
      type: object
      required: [id, field, code, message]
      properties:
        id:
          type: string
          format: uuid
          description: The transaction the problem belongs to.
        field:
          type: string
          description: Which part is wrong (date, payee, note, category, amount, account, entries), or empty.
        code:
          type: string
          description: Stable code, e.g. category_required.
        message:
          type: string
    BatchErrors:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BatchProblem'
    HolidayShift:
      type: string
      enum: [noShift, nextWorkday, prevWorkday]
      description: Moving an occurrence that falls on a day off (ADR-087).
    BudgetMode:
      type: string
      enum: [notBudgeted, full, spread]
      description: |
        How the schedule counts in its envelope's target (ADR-086): not at
        all, the sum of its occurrences in their month, or each occurrence
        spread over the months before it.
    ScheduleInput:
      type: object
      required: [id, source, rule, start, holidayShift, payee, note, accountId, transferAccountId, categoryId, amount, estimate, budgetMode, paused]
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          maxLength: 100
          description: The rule as the user wrote it (每月 5 日), shown back as written.
        rule:
          type: string
          minLength: 1
          maxLength: 200
          description: iCalendar RRULE without DTSTART, e.g. FREQ=MONTHLY;BYMONTHDAY=5.
        start:
          type: string
          format: date
          description: DTSTART; the first occurrence is the first date the rule gives from here.
        holidayShift:
          $ref: '#/components/schemas/HolidayShift'
        payee:
          type: string
          maxLength: 64
        note:
          type: string
          maxLength: 255
        accountId:
          type: string
          format: uuid
        transferAccountId:
          type: string
          format: uuid
          nullable: true
          description: The other account of a transfer; then categoryId is null.
        categoryId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: integer
          format: int64
          description: Change in the account's balance per occurrence (negative = spent).
        estimate:
          type: boolean
          description: The amount is a guess; posted transactions need review.
        budgetMode:
          $ref: '#/components/schemas/BudgetMode'
        paused:
          type: boolean
    Schedule:
      allOf:
        - $ref: '#/components/schemas/ScheduleInput'
        - type: object
          required: [nextOccurrence, nextDate, skips]
          properties:
            nextOccurrence:
              type: string
              format: date
              nullable: true
              description: The next occurrence not yet posted, as the rule gives it; null once the rule has ended.
            nextDate:
              type: string
              format: date
              nullable: true
              description: The date it will be posted on, after moving off days off.
            skips:
              type: array
              items:
                type: string
                format: date
    ScheduleBatch:
      type: object
      required: [upserts, deletes]
      properties:
        upserts:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ScheduleInput'
        deletes:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
    ScheduleBatchSaved:
      type: object
      required: [upserted, deleted, posted]
      properties:
        upserted:
          type: integer
          format: int32
        deleted:
          type: integer
          format: int32
        posted:
          type: integer
          format: int32
          description: Occurrences that were due and got posted.
    Occurrence:
      type: object
      required: [scheduleId, occurrence, date, payee, note, accountId, transferAccountId, categoryId, amount, estimate]
      properties:
        scheduleId:
          type: string
          format: uuid
        occurrence:
          type: string
          format: date
          description: The date the rule gives; identifies the occurrence.
        date:
          type: string
          format: date
          description: The date it is posted on.
        payee:
          type: string
        note:
          type: string
        accountId:
          type: string
          format: uuid
        transferAccountId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: integer
          format: int64
        estimate:
          type: boolean
        entries:
          type: array
          items:
            $ref: '#/components/schemas/OccurrenceEntry'
          description: |
            Every entry the occurrence posts, when it is more than one line
            (a loan payment, principal and interest, ADR-097).
    LoanMethod:
      type: string
      enum: [annuity, equalPrincipal]
      description: 本息平均攤還 (level payments) or 本金平均攤還 (equal principal).
    PrepayMode:
      type: string
      enum: [shortenTerm, reducePayment]
      description: What an extra payment does, end earlier or keep the end and pay less.
    LoanRate:
      type: object
      required: [effectiveFrom, annualRate]
      properties:
        effectiveFrom:
          type: string
          format: date
        annualRate:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Percent a year, up to four decimals (2.35 is 2.35%).
    LoanTerms:
      type: object
      required: [principal, termMonths, startDate, firstPaymentDate, method, graceMonths, prepayMode, rates,
                 payFromAccountId, principalCategoryId, interestCategoryId, holidayShift]
      properties:
        principal:
          type: integer
          format: int64
          minimum: 1
          description: The amount lent.
        termMonths:
          type: integer
          format: int32
          minimum: 1
          maximum: 600
        startDate:
          type: string
          format: date
          description: 撥款日.
        firstPaymentDate:
          type: string
          format: date
          description: 首期繳款日; its day of the month is the payment day.
        method:
          $ref: '#/components/schemas/LoanMethod'
        graceMonths:
          type: integer
          format: int32
          minimum: 0
          description: Months at the start that pay only interest.
        prepayMode:
          $ref: '#/components/schemas/PrepayMode'
        rates:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LoanRate'
          description: The first from 撥款日, later ones are rate changes from their date.
        payFromAccountId:
          type: string
          format: uuid
          nullable: true
          description: The on-budget account payments come from; without one nothing is posted.
        principalCategoryId:
          type: string
          format: uuid
          nullable: true
        interestCategoryId:
          type: string
          format: uuid
          nullable: true
        holidayShift:
          $ref: '#/components/schemas/HolidayShift'
    LoanPeriodState:
      type: string
      enum: [before, posted, skipped, pending, planned]
      description: |
        `before`: paid before the loan was set up (from the terms); `posted`:
        paid by its schedule (actual figures); `skipped`; `pending`: its date has
        come but it is not posted; `planned`: still to come.
    LoanPeriod:
      type: object
      required: [n, date, annualRate, principal, interest, balance, state]
      properties:
        n:
          type: integer
          format: int32
        date:
          type: string
          format: date
          description: The payment date the terms give (before moving off days off).
        annualRate:
          type: number
          format: double
        principal:
          type: integer
          format: int64
        interest:
          type: integer
          format: int64
        balance:
          type: integer
          format: int64
          description: What is owed after it.
        state:
          $ref: '#/components/schemas/LoanPeriodState'
    LoanPreview:
      type: object
      required: [payment, totalInterest, periods]
      properties:
        payment:
          type: integer
          format: int64
          description: The first payment that repays principal (after any grace).
        totalInterest:
          type: integer
          format: int64
        periods:
          type: array
          items:
            $ref: '#/components/schemas/LoanPeriod'
    LoanCheck:
      type: object
      required: [date, computed, recorded]
      description: What the terms say is owed on a day against what the loan account says.
      properties:
        date:
          type: string
          format: date
        computed:
          type: integer
          format: int64
        recorded:
          type: integer
          format: int64
    LoanDetails:
      type: object
      required: [accountId, terms, trackedFrom, scheduleId, principalLeft, principalRepaid, interestPaid,
                 periodsLeft, nextPayment, payoffDate, check, periods]
      properties:
        accountId:
          type: string
          format: uuid
        terms:
          $ref: '#/components/schemas/LoanTerms'
        trackedFrom:
          type: string
          format: date
          nullable: true
          description: The first payment its schedule pays; earlier ones were paid before it was set up.
        scheduleId:
          type: string
          format: uuid
          nullable: true
        principalLeft:
          type: integer
          format: int64
          description: What the loan account says is owed today.
        principalRepaid:
          type: integer
          format: int64
        interestPaid:
          type: integer
          format: int64
          description: The terms' interest before it was set up plus what its payments posted.
        periodsLeft:
          type: integer
          format: int32
        nextPayment:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LoanPeriod'
        payoffDate:
          type: string
          format: date
          nullable: true
        check:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LoanCheck'
          description: Before the first tracked payment, terms against the account (null when it is paid off).
        periods:
          type: array
          items:
            $ref: '#/components/schemas/LoanPeriod'
    LoanAlign:
      type: object
      required: [date, principalLeft]
      properties:
        date:
          type: string
          format: date
        principalLeft:
          type: integer
          format: int64
          minimum: 0
          description: What the bank shows as owed at the end of that day.
    LoanAligned:
      type: object
      required: [transactionId, adjustment]
      properties:
        transactionId:
          type: string
          format: uuid
          nullable: true
        adjustment:
          type: integer
          format: int64
          description: The change posted on the loan account (positive lowers what is owed).
    OccurrenceEntry:
      type: object
      required: [accountId, categoryId, amount, memo]
      properties:
        memo:
          type: string
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: integer
          format: int64
    OccurrenceRef:
      type: object
      required: [occurrence]
      properties:
        occurrence:
          type: string
          format: date
    Posted:
      type: object
      required: [transactionId]
      properties:
        transactionId:
          type: string
          format: uuid
    ScheduledOccurrence:
      type: object
      required: [scheduleId, occurrence]
      description: The schedule occurrence a new transaction posts (an edited 預定 row).
      properties:
        scheduleId:
          type: string
          format: uuid
        occurrence:
          type: string
          format: date
    CategoryBase:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 0
          description: Base amount per month; 0 removes it.
    EnvelopeTarget:
      type: object
      required: [categoryId, total, base, schedules, goals]
      properties:
        categoryId:
          type: string
          format: uuid
          description: The envelope.
        total:
          type: integer
          format: int64
          description: base plus the schedules' and the goals' amounts.
        base:
          type: integer
          format: int64
          nullable: true
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleShare'
        goals:
          type: array
          description: What the envelope's open goals ask this month, in priority order (ADR-093).
          items:
            $ref: '#/components/schemas/GoalShare'
    GoalShare:
      type: object
      required: [goalId, amount]
      properties:
        goalId:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
    GoalKind:
      type: string
      enum: [target, targetByDate, maintain, monthly]
      description: |
        目標金額 (a total, optionally saved at most monthlyAmount a month),
        期限前存到 (a total by a date), 維持水位 (maintainMonths times the
        average monthly spending, optionally at most monthlyAmount a month),
        每月固定 (monthlyAmount every month, no total) (ADR-092).
    GoalStatus:
      type: string
      enum: [saving, full, waiting, achieved, archived]
      description: |
        存錢中, 已存滿, 冷靜中 (full but its waitUntil is still ahead), 已達成
        (marked by the owner), 已封存.
    GoalInput:
      type: object
      required: [id, categoryId, name, kind, targetAmount, targetDate, monthlyAmount, maintainMonths, note, url, waitUntil, achieved, archived, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          description: An expense category; the goal counts for the envelope it is budgeted in.
        name:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/GoalKind'
        targetAmount:
          type: integer
          format: int64
          nullable: true
          description: target and targetByDate.
        targetDate:
          type: string
          format: date
          nullable: true
          description: targetByDate.
        monthlyAmount:
          type: integer
          format: int64
          nullable: true
          description: monthly; at most this much a month for target and maintain.
        maintainMonths:
          type: integer
          format: int32
          nullable: true
          description: maintain.
        note:
          type: string
          maxLength: 500
        url:
          type: string
          maxLength: 2000
          description: Where the thing to buy is sold.
        waitUntil:
          type: string
          format: date
          nullable: true
          description: A cooling-off date; full goals show 冷靜中 until then.
        achieved:
          type: boolean
        archived:
          type: boolean
        sortOrder:
          type: integer
          format: int32
          description: Position in the budget's priority order (lower first).
    Goal:
      allOf:
        - $ref: '#/components/schemas/GoalInput'
        - type: object
          required: [envelopeId, createdAt, achievedAt, saved, total, ask, status]
          properties:
            envelopeId:
              type: string
              format: uuid
              nullable: true
              description: The envelope the goal counts for; null when its category is in none.
            createdAt:
              type: string
              format: date-time
            achievedAt:
              type: string
              format: date-time
              nullable: true
            saved:
              type: integer
              format: int64
              description: Its share of its envelope's balance today.
            total:
              type: integer
              format: int64
              nullable: true
              description: The amount it saves towards (the level for maintain); null for monthly.
            ask:
              type: integer
              format: int64
              description: What it asks of its envelope this month (ADR-093).
            status:
              $ref: '#/components/schemas/GoalStatus'
    EnvelopeBalance:
      type: object
      required: [categoryId, balance, carried]
      properties:
        categoryId:
          type: string
          format: uuid
        balance:
          type: integer
          format: int64
          description: At the end of the current month.
        carried:
          type: integer
          format: int64
          description: At the start of the current month.
    GoalList:
      type: object
      required: [month, goals, averageSpending, typicalIncome, baseTargets, envelopes]
      properties:
        month:
          type: string
          description: The current month, YYYY-MM.
        goals:
          type: array
          items:
            $ref: '#/components/schemas/Goal'
        averageSpending:
          type: integer
          format: int64
          description: Average monthly spending over the last six complete months that have any.
        typicalIncome:
          type: integer
          format: int64
          description: Median monthly income over the last six complete months that have any.
        baseTargets:
          type: integer
          format: int64
          description: This month's targets without goals (bases and schedules).
        envelopes:
          type: array
          description: |
            Every envelope with money, folded as the targets are, less what
            its schedules hold (ADR-095): the money its goals share.
          items:
            $ref: '#/components/schemas/EnvelopeBalance'
    GoalBatch:
      type: object
      required: [upserts, deletes]
      properties:
        upserts:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/GoalInput'
        deletes:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
    GoalBatchSaved:
      type: object
      required: [upserted, deleted]
      properties:
        upserted:
          type: integer
          format: int32
        deleted:
          type: integer
          format: int32
    ScheduleShare:
      type: object
      required: [scheduleId, amount]
      properties:
        scheduleId:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: What the schedule asks of the envelope this month (spending is positive).
        loanAccountId:
          type: string
          format: uuid
          nullable: true
          description: |
            The loan a loan's schedule pays (ADR-097): its principal and
            interest count in their categories' envelopes. Such schedules are
            not on the schedules page.
    HolidayCalendar:
      type: object
      required: [years, days]
      properties:
        years:
          type: array
          description: Years with an imported calendar.
          items:
            type: integer
            format: int32
        days:
          type: array
          items:
            $ref: '#/components/schemas/Holiday'
    Holiday:
      type: object
      required: [date, off, note]
      properties:
        date:
          type: string
          format: date
        off:
          type: boolean
        note:
          type: string
    HolidayYear:
      type: object
      required: [year, sourceUrl, days, daysOff, importedAt, importedBy]
      properties:
        year:
          type: integer
          format: int32
        sourceUrl:
          type: string
          description: Where it was fetched from; empty when imported from a file.
        days:
          type: integer
          format: int32
        daysOff:
          type: integer
          format: int32
        importedAt:
          type: string
          format: date-time
        importedBy:
          type: string
          nullable: true
    HolidayImport:
      type: object
      properties:
        url:
          type: string
          maxLength: 2000
        csv:
          type: string
          maxLength: 1000000
  responses:
    Redirect:
      description: Redirect
      headers:
        Location:
          schema:
            type: string
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Login required, or wrong credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Duplicate key, or the resource is still in use
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
