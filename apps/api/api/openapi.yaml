openapi: 3.0.3
info:
  title: Factual API
  version: 0.5.0
  description: |
    The API is spec-first: this file is the source of truth for the Go server
    (oapi-codegen) and the web client types (openapi-typescript).

    Access control: every operation declares exactly one `x-auth`:
    `public`, `authenticated` (any logged-in user) or `admin` (instance
    admin). The API does not start otherwise. Operations inside a budget
    also declare `x-budget: read | write | manage`, the permission the
    caller's role in that budget must grant. Errors use the `Error` envelope.
servers:
  - url: /api
tags:
  - name: system
  - name: auth
  - name: ledger
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Whether the API is up and can reach its database
      x-auth: public
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  # --- Sessions ---
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with username and password
      description: Creates a session and sets the session cookie.
      x-auth: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      description: Always succeeds; clears the session cookie.
      x-auth: public
      responses:
        '204':
          description: Logged out
          headers:
            Set-Cookie:
              schema:
                type: string

  # --- OpenID Connect. The browser navigates to the flow endpoints (no
  # fetch); results come back as redirects to web pages with ?error=<code>.
  /auth/oidc/providers:
    get:
      operationId: listLoginProviders
      tags: [auth]
      summary: Enabled identity providers for the login page
      x-auth: public
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoginProvider'
  /auth/oidc/{code}/login:
    parameters:
      - $ref: '#/components/parameters/ProviderCode'
      - $ref: '#/components/parameters/Redirect'
    get:
      operationId: startOidcLogin
      tags: [auth]
      summary: Start logging in with an identity provider
      description: Sets the flow cookie and redirects to the IdP (or to /login?error=...).
      x-auth: public
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
  /auth/oidc/{code}/link:
    parameters:
      - $ref: '#/components/parameters/ProviderCode'
    get:
      operationId: startOidcLink
      tags: [auth]
      summary: Start linking an identity to the logged-in user
      description: Sets the flow cookie and redirects to the IdP (or to /profile?error=...).
      x-auth: authenticated
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: Redirect target of every identity provider
      description: |
        Completes the flow from the flow cookie. Login: sets the session cookie
        and redirects to the requested page, or to /login?error=<code>. Link:
        redirects to /profile?linked=<provider> or /profile?error=<code>.
      x-auth: public
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by the IdP when the user cancelled or the request failed.
          schema:
            type: string
      responses:
        '302':
          $ref: '#/components/responses/Redirect'

  # --- Identity provider settings (instance admin) ---
  /oidc-providers:
    get:
      operationId: listOidcProviders
      tags: [auth]
      summary: Identity providers (client secrets are never returned)
      x-auth: admin
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProviderList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createOidcProvider
      tags: [auth]
      summary: Add an identity provider (the issuer must serve OIDC discovery)
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcProviderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProvider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /oidc-providers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateOidcProvider
      tags: [auth]
      summary: Update an identity provider (an empty clientSecret keeps the stored one)
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcProviderInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProvider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteOidcProvider
      tags: [auth]
      summary: Delete an identity provider (its linked identities are removed)
      x-auth: admin
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # --- The logged-in user ---
  /me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The logged-in user
      x-auth: authenticated
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/password:
    put:
      operationId: changePassword
      tags: [auth]
      summary: Set or change the logged-in user's password
      description: |
        `currentPassword` is required when the user already has a password.
        Other sessions of the user are ended; the current one stays.
      x-auth: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/identities:
    get:
      operationId: listMyIdentities
      tags: [auth]
      summary: Identities the logged-in user linked
      x-auth: authenticated
      responses:
        '200':
          description: Linked identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkedIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/identities/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      operationId: unlinkMyIdentity
      tags: [auth]
      summary: Unlink one of the logged-in user's identities
      description: Refused when it is the user's last way to log in (no password, no other identity).
      x-auth: authenticated
      responses:
        '204':
          description: Unlinked
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/preferences:
    get:
      operationId: getPreferences
      tags: [auth]
      summary: The logged-in user's preferences
      x-auth: authenticated
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updatePreferences
      tags: [auth]
      summary: Replace the logged-in user's preferences
      x-auth: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # --- Budgets. Operations inside a budget declare `x-budget`: the
  # permission the caller's role in that budget must grant (ADR-017).
  /budgets:
    get:
      operationId: listBudgets
      tags: [ledger]
      summary: Budgets the caller is a member of
      x-auth: authenticated
      responses:
        '200':
          description: Budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createBudget
      tags: [ledger]
      summary: Create a budget owned by the caller
      description: The first budget a user creates becomes their default one.
      x-auth: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          $ref: '#/components/responses/BadRequest'
  /budgets/{budgetId}:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    get:
      operationId: getBudget
      tags: [ledger]
      summary: One budget
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: Budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateBudget
      tags: [ledger]
      summary: Rename a budget
      x-auth: authenticated
      x-budget: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/summary:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    get:
      operationId: getBudgetSummary
      tags: [ledger]
      summary: Totals of a budget
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Accounts
  /budgets/{budgetId}/accounts:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    get:
      operationId: listAccounts
      tags: [ledger]
      summary: Accounts of a budget with their balances
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createAccount
      tags: [ledger]
      summary: Add an account, with its opening balance
      x-auth: authenticated
      x-budget: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /budgets/{budgetId}/accounts/order:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    put:
      operationId: reorderAccounts
      tags: [ledger]
      summary: Set the order of accounts
      description: Accounts are shown in the order of `ids`; accounts not listed keep their place after them.
      x-auth: authenticated
      x-budget: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reorder'
      responses:
        '204':
          description: Reordered
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/AccountId'
    put:
      operationId: updateAccount
      tags: [ledger]
      summary: Rename, close or reopen an account
      x-auth: authenticated
      x-budget: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteAccount
      tags: [ledger]
      summary: Delete an account that has no transactions besides its opening balance
      x-auth: authenticated
      x-budget: manage
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # --- Categories
  /budgets/{budgetId}/categories:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    get:
      operationId: listCategories
      tags: [ledger]
      summary: Categories of a budget (flat; build the tree from parentId)
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createCategory
      tags: [ledger]
      summary: Add a category (at most three levels; children take their parent's kind)
      x-auth: authenticated
      x-budget: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /budgets/{budgetId}/categories/order:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    put:
      operationId: reorderCategories
      tags: [ledger]
      summary: Set the order of the categories under one parent
      x-auth: authenticated
      x-budget: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reorder'
      responses:
        '204':
          description: Reordered
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/CategoryId'
    put:
      operationId: updateCategory
      tags: [ledger]
      summary: Rename, archive, or share one envelope among the children
      x-auth: authenticated
      x-budget: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteCategory
      tags: [ledger]
      summary: Delete an unused category (archive it otherwise)
      x-auth: authenticated
      x-budget: manage
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # --- Transactions (M4: the account register and :w)
  /budgets/{budgetId}/accounts/{accountId}/register:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: getRegister
      tags: [ledger]
      summary: Every transaction touching an account, with all of their entries
      description: Oldest first. Balances are computed by the client from the entries.
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/register:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    get:
      operationId: getScopeRegister
      tags: [ledger]
      summary: Transactions on a group of accounts, oldest first
      description: |
        Every transaction with an entry on an account in the scope: all
        accounts, the budget accounts, or the tracking accounts (ADR-071).
        Each comes with all of its entries, as in an account's register.
      x-auth: authenticated
      x-budget: read
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/RegisterScope'
      responses:
        '200':
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/payees:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    get:
      operationId: listPayees
      tags: [ledger]
      summary: Payees, with the category last used for each
      x-auth: authenticated
      x-budget: read
      responses:
        '200':
          description: Payees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payee'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/payees/{payeeId}:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/PayeeId'
    put:
      operationId: renamePayee
      tags: [ledger]
      summary: Rename a payee
      description: Answers 409 `payee_exists` when another payee has the name; merge them instead.
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayeeUpdate'
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deletePayee
      tags: [ledger]
      summary: Delete a payee no transaction or schedule uses
      x-auth: authenticated
      x-budget: write
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /budgets/{budgetId}/payees/{payeeId}/merge:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/PayeeId'
    post:
      operationId: mergePayees
      tags: [ledger]
      summary: Merge other payees into this one
      description: |
        Transactions and schedules of the source payees move to this payee,
        then the sources are deleted, in one database transaction.
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayeeMerge'
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets/{budgetId}/transactions/batch:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    post:
      operationId: saveTransactions
      tags: [ledger]
      summary: Apply an editor buffer in one database transaction (:w)
      description: |
        Upserts are keyed by the client-generated transaction id (ADR-021):
        an unknown id creates the transaction, a known one replaces its date,
        payee, note and entries. Payees are given by name and created when
        missing. Either everything is applied or nothing is, and every problem
        found is reported against the transaction it belongs to (ADR-044).
      x-auth: authenticated
      x-budget: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionBatch'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSaved'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Nothing was saved; the transactions listed have problems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrors'

components:
  parameters:
    BudgetId:
      name: budgetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PayeeId:
      name: payeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderCode:
      name: code
      in: path
      required: true
      schema:
        type: string
    Redirect:
      name: redirect
      in: query
      description: App path to land on after login (must start with /).
      schema:
        type: string
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `not_found`, `unauthorized`.
        message:
          type: string
          description: Human-readable message.
        details:
          type: object
          additionalProperties: true

    # --- Auth ---
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 256
          description: Empty when the user has no password yet.
        newPassword:
          type: string
          minLength: 8
          maxLength: 256
    CurrentUser:
      type: object
      required: [id, username, displayName, email, isAdmin, hasPassword]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
          description: Instance admin; may manage identity providers.
        hasPassword:
          type: boolean
          description: Whether the user can log in with a password.
    Preferences:
      type: object
      required: [editorKeymap]
      properties:
        editorKeymap:
          type: string
          maxLength: 8000
          description: |
            Key mappings for the editors in vimrc form (`inoremap jk <Esc>`,
            `nnoremap H 0`, `let mapleader = ","`). Parsed by the web app;
            the server only stores it.
    LoginProvider:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    OidcProvider:
      type: object
      required: [id, code, name, issuer, clientId, hasSecret, scopes, sort, enabled, remark, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        issuer:
          type: string
        clientId:
          type: string
        hasSecret:
          type: boolean
          description: Whether a client secret is stored (it is never returned).
        scopes:
          type: string
        sort:
          type: integer
          format: int32
        enabled:
          type: boolean
        remark:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OidcProviderInput:
      type: object
      required: [code, name, issuer, clientId, clientSecret, scopes, sort, enabled, remark]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_-]{1,31}$'
          description: Used in URLs, e.g. `google`.
        name:
          type: string
          minLength: 1
          maxLength: 64
        issuer:
          type: string
          minLength: 1
          maxLength: 255
        clientId:
          type: string
          minLength: 1
          maxLength: 255
        clientSecret:
          type: string
          maxLength: 2048
          description: Empty on update keeps the stored secret.
        scopes:
          type: string
          maxLength: 255
        sort:
          type: integer
          format: int32
        enabled:
          type: boolean
        remark:
          type: string
          maxLength: 255
    OidcProviderList:
      type: object
      required: [items, callbackUrl, encryptionConfigured]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OidcProvider'
        callbackUrl:
          type: string
          description: Redirect URI to register at every identity provider.
        encryptionConfigured:
          type: boolean
          description: Whether FACTUAL_ENCRYPTION_KEY is set; OIDC login needs it.
    LinkedIdentity:
      type: object
      required: [id, providerCode, providerName, email, createdAt, lastLoginAt]
      properties:
        id:
          type: string
          format: uuid
        providerCode:
          type: string
        providerName:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    # --- Ledger. Amounts are integers in the budget's minor unit (minorUnits
    # digits after the decimal point; 0 for TWD).
    BudgetRole:
      type: string
      enum: [owner, editor, viewer]
    Budget:
      type: object
      required: [id, name, currency, minorUnits, role, isDefault, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
          description: ISO 4217 code, e.g. TWD.
        minorUnits:
          type: integer
          format: int32
          description: Digits after the decimal point in amounts of this budget.
        role:
          $ref: '#/components/schemas/BudgetRole'
        isDefault:
          type: boolean
          description: The caller's default budget (shared expenses land here).
        createdAt:
          type: string
          format: date-time
    BudgetCreate:
      type: object
      required: [name, currency, starterCategories]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        starterCategories:
          type: boolean
          description: Create a common set of categories to start from.
    BudgetUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
    BudgetSummary:
      type: object
      required: [pool, onBudgetBalance, offBudgetBalance]
      properties:
        pool:
          type: integer
          format: int64
          description: Money not yet given to any envelope.
        onBudgetBalance:
          type: integer
          format: int64
          description: Sum of the on-budget accounts.
        offBudgetBalance:
          type: integer
          format: int64
          description: Sum of the tracking (off-budget) accounts.
    AccountKind:
      type: string
      enum: [cash, bank, credit_card, loan, investment]
    Account:
      type: object
      required: [id, name, kind, onBudget, closed, sortOrder, balance, clearedBalance, hasActivity]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/AccountKind'
        onBudget:
          type: boolean
        closed:
          type: boolean
        sortOrder:
          type: integer
          format: int32
        balance:
          type: integer
          format: int64
        clearedBalance:
          type: integer
          format: int64
        hasActivity:
          type: boolean
          description: Whether the account has transactions besides its opening balance (it then cannot be deleted).
    AccountCreate:
      type: object
      required: [name, kind, onBudget, openingBalance, openingDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          $ref: '#/components/schemas/AccountKind'
        onBudget:
          type: boolean
          description: Ignored for credit cards (always on budget), loans and investments (never).
        openingBalance:
          type: integer
          format: int64
          description: Balance on openingDate; negative for money owed (a credit card, a loan).
        openingDate:
          type: string
          format: date
    AccountUpdate:
      type: object
      required: [name, closed]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        closed:
          type: boolean
          description: A closed account is hidden from pickers; it must have a zero balance.
    CategoryKind:
      type: string
      enum: [expense, income]
    Category:
      type: object
      required: [id, parentId, name, kind, pooled, isSystem, sortOrder, archived]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        kind:
          $ref: '#/components/schemas/CategoryKind'
        pooled:
          type: boolean
          description: The subcategories share this category's budget (its envelope).
        isSystem:
          type: boolean
          description: Created by the app (e.g. opening balances); cannot be changed.
        sortOrder:
          type: integer
          format: int32
        archived:
          type: boolean
    CategoryCreate:
      type: object
      required: [parentId, name, kind]
      properties:
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 32
        kind:
          $ref: '#/components/schemas/CategoryKind'
        pooled:
          type: boolean
          description: Defaults to true for expense categories (ADR-061); income categories never pool.
    CategoryUpdate:
      type: object
      required: [name, pooled, archived]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
        pooled:
          type: boolean
        archived:
          type: boolean
    Reorder:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
    RegisterScope:
      type: string
      enum: [all, onBudget, offBudget]
    ClearedState:
      type: string
      enum: [uncleared, cleared, reconciled]
    Entry:
      type: object
      required: [id, accountId, categoryId, amount, memo, cleared]
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: integer
          format: int64
          description: Change in the account's balance.
        memo:
          type: string
        cleared:
          $ref: '#/components/schemas/ClearedState'
    Transaction:
      type: object
      required: [id, date, payeeId, payeeName, note, needsReview, isOpening, entries]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        payeeId:
          type: string
          format: uuid
          nullable: true
        payeeName:
          type: string
          nullable: true
        note:
          type: string
        needsReview:
          type: boolean
        isOpening:
          type: boolean
          description: The opening balance of an account.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
    Payee:
      type: object
      required: [id, name, lastCategoryId, transactionCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lastCategoryId:
          type: string
          format: uuid
          nullable: true
          description: The category of the payee's most recent categorized entry, to fill in new rows.
        transactionCount:
          type: integer
          format: int32
    PayeeUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
    PayeeMerge:
      type: object
      required: [sourceIds]
      properties:
        sourceIds:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            format: uuid
    EntryInput:
      type: object
      required: [accountId, categoryId, amount, memo, cleared]
      properties:
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: integer
          format: int64
        memo:
          type: string
          maxLength: 255
        cleared:
          $ref: '#/components/schemas/ClearedState'
    TransactionInput:
      type: object
      required: [id, date, payee, note, entries]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        payee:
          type: string
          maxLength: 64
          description: Payee name; empty for none (e.g. a transfer). Created when it does not exist.
        note:
          type: string
          maxLength: 255
        entries:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/EntryInput'
    TransactionBatch:
      type: object
      required: [upserts, deletes]
      properties:
        upserts:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/TransactionInput'
        deletes:
          type: array
          maxItems: 2000
          items:
            type: string
            format: uuid
    BatchSaved:
      type: object
      required: [upserted, deleted]
      properties:
        upserted:
          type: integer
          format: int32
        deleted:
          type: integer
          format: int32
    BatchProblem:
      type: object
      required: [id, field, code, message]
      properties:
        id:
          type: string
          format: uuid
          description: The transaction the problem belongs to.
        field:
          type: string
          description: Which part is wrong (date, payee, note, category, amount, account, entries), or empty.
        code:
          type: string
          description: Stable code, e.g. category_required.
        message:
          type: string
    BatchErrors:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BatchProblem'
  responses:
    Redirect:
      description: Redirect
      headers:
        Location:
          schema:
            type: string
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Login required, or wrong credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Duplicate key, or the resource is still in use
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
