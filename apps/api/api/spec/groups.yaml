# Groups and their shared expenses.
# Part of the API spec; spec/root.yaml lists every path. Bundled into
# ../openapi.yaml by `mise run gen`.
paths:
  # --- The 分帳 page (ADR-116)
  splittingBatch:
    post:
      operationId: saveSplitting
      tags: [splitting]
      summary: Apply the 分帳 page's buffer of friends and groups in one database transaction (:w)
      description: |
        Friends and groups are keyed by ids the client chose for new ones.
        New friends are placeholders (ADR-104) with a friend account in the
        caller's default budget; a group's members are friends, new ones of
        the same batch included, and replace its members (the caller stays
        its admin). Applied in that order: friends, groups, deleted groups,
        deleted friends. All or nothing, with problems reported per friend or
        group (ADR-044); `name_taken` (409) when two accounts of the budget
        would have one name.
      x-auth: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/SplittingBatch'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/schemas/SplittingBatchSaved'
        '400':
          $ref: './common.yaml#/responses/BadRequest'
        '401':
          $ref: './common.yaml#/responses/Unauthorized'
        '409':
          $ref: './common.yaml#/responses/Conflict'
        '422':
          description: Nothing was saved; the friends and groups listed have problems
          content:
            application/json:
              schema:
                $ref: './common.yaml#/schemas/BatchErrors'

  # --- Groups (M13, ADR-037, ADR-104, ADR-115)
  groups:
    get:
      operationId: listGroups
      tags: [splitting]
      summary: The groups the caller is a member of, with each member's balance
      description: |
        Archived groups included (`archived`). Each has one group account in
        the caller's default budget (ADR-037), whose balance is the caller's
        net position in the group.
      x-auth: authenticated
      responses:
        '200':
          description: Groups, active first, then by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/schemas/Group'
        '401':
          $ref: './common.yaml#/responses/Unauthorized'
    post:
      operationId: createGroup
      tags: [splitting]
      summary: Create a group of the caller and some of their friends
      description: |
        The caller is its admin. Members are friends of the caller (placeholders
        for now; registered friends join with M15, `registered_member`) or new
        names, which become placeholder friends (ADR-104). The group's currency
        is the caller's default budget's (ADR-041), and its group account is
        created in that budget. Fails with `no_default_budget` while the caller
        has no budget and `name_taken` when the budget already has an account
        of that name.
      x-auth: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/GroupInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/schemas/Group'
        '400':
          $ref: './common.yaml#/responses/BadRequest'
        '401':
          $ref: './common.yaml#/responses/Unauthorized'
        '409':
          $ref: './common.yaml#/responses/Conflict'

  group:
    parameters:
      - $ref: './common.yaml#/parameters/GroupId'
    put:
      operationId: updateGroup
      tags: [splitting]
      summary: Rename a group, change its members, or archive it
      description: |
        Only its admin changes a group. `members` is the whole list besides the
        caller: missing members are removed, which is refused for a member any
        shared expense names (`member_in_use`). Archiving needs every balance
        settled (`group_not_settled`) and closes the group account; an archived
        group takes no expenses (`group_archived`) until it is unarchived.
      x-auth: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/GroupInput'
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                $ref: '#/schemas/Group'
        '400':
          $ref: './common.yaml#/responses/BadRequest'
        '401':
          $ref: './common.yaml#/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/responses/Forbidden'
        '404':
          $ref: './common.yaml#/responses/NotFound'
        '409':
          $ref: './common.yaml#/responses/Conflict'
    delete:
      operationId: deleteGroup
      tags: [splitting]
      summary: Delete a group without shared expenses
      description: |
        Removes the group, its members and its group account. Fails with
        `group_in_use` while shared expenses remain (archive it instead).
      x-auth: authenticated
      responses:
        '204':
          description: Deleted
        '401':
          $ref: './common.yaml#/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/responses/Forbidden'
        '404':
          $ref: './common.yaml#/responses/NotFound'
        '409':
          $ref: './common.yaml#/responses/Conflict'

  expenses:
    parameters:
      - $ref: './common.yaml#/parameters/GroupId'
    get:
      operationId: listGroupExpenses
      tags: [splitting]
      summary: The group's shared expenses and settlements
      description: |
        Oldest first, deleted ones left out, each with the caller's side in
        their own ledger (`mine`), as a friend's expenses are.
      x-auth: authenticated
      responses:
        '200':
          description: Shared expenses
          content:
            application/json:
              schema:
                $ref: '#/schemas/GroupExpenses'
        '401':
          $ref: './common.yaml#/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/responses/NotFound'

  expensesBatch:
    parameters:
      - $ref: './common.yaml#/parameters/GroupId'
    post:
      operationId: saveGroupExpenses
      tags: [splitting]
      summary: Apply the group page's buffer in one database transaction (:w)
      description: |
        As for a friend (ADR-106), among the group's members: any of them may
        pay and share, and a settlement is between any two. The caller's
        transaction, on the group account, is written when they pay, are paid
        or have a share. All or nothing, with problems reported per expense.
      x-auth: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './friends.yaml#/schemas/SharedExpenseBatch'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: './friends.yaml#/schemas/SharedExpenseBatchSaved'
        '400':
          $ref: './common.yaml#/responses/BadRequest'
        '401':
          $ref: './common.yaml#/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/responses/NotFound'
        '409':
          $ref: './common.yaml#/responses/Conflict'
        '422':
          description: Nothing was saved; the expenses listed have problems
          content:
            application/json:
              schema:
                $ref: './common.yaml#/schemas/BatchErrors'
schemas:
  FriendUpsert:
    type: object
    required: [id, displayName]
    properties:
      id:
        type: string
        format: uuid
      displayName:
        type: string
        maxLength: 64

  GroupUpsert:
    type: object
    required: [id, name, members, archived]
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
        maxLength: 64
      members:
        type: array
        maxItems: 50
        description: Everyone besides the caller, as friend ids (new friends of the batch included).
        items:
          type: string
          format: uuid
      archived:
        type: boolean

  SplittingBatch:
    type: object
    required: [friends, deleteFriends, groups, deleteGroups]
    properties:
      friends:
        type: array
        maxItems: 500
        items:
          $ref: '#/schemas/FriendUpsert'
      deleteFriends:
        type: array
        maxItems: 500
        items:
          type: string
          format: uuid
      groups:
        type: array
        maxItems: 500
        items:
          $ref: '#/schemas/GroupUpsert'
      deleteGroups:
        type: array
        maxItems: 500
        items:
          type: string
          format: uuid

  SplittingBatchSaved:
    type: object
    required: [upserted, deleted]
    properties:
      upserted:
        type: integer
        format: int32
      deleted:
        type: integer
        format: int32

  GroupRole:
    type: string
    enum: [admin, member]

  GroupMember:
    type: object
    required: [userId, displayName, placeholder, role, paid, share, balance]
    properties:
      userId:
        type: string
        format: uuid
      displayName:
        type: string
      placeholder:
        type: boolean
        description: Has no account yet (ADR-016).
      role:
        $ref: '#/schemas/GroupRole'
      paid:
        type: integer
        format: int64
        description: What they have paid in the group's expenses and settlements.
      share:
        type: integer
        format: int64
        description: What their shares come to (a settlement's receiver shares all of it).
      balance:
        type: integer
        format: int64
        description: "paid - share: what the group owes them (negative: what they owe)."

  Group:
    type: object
    required: [id, name, currency, archived, createdBy, members, budgetId, accountId, balance, expenseCount]
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      currency:
        type: string
        description: What its expenses are settled in, the creator's budget currency (ADR-041).
      archived:
        type: boolean
      createdBy:
        type: string
        format: uuid
      members:
        type: array
        description: The admin first, then in the order they joined.
        items:
          $ref: '#/schemas/GroupMember'
      budgetId:
        type: string
        format: uuid
        nullable: true
        description: The caller's default budget, which holds the group account.
      accountId:
        type: string
        format: uuid
        nullable: true
        description: The group account in that budget.
      balance:
        type: integer
        format: int64
        description: "The group account's balance: what the group owes the caller (negative: what they owe)."
      expenseCount:
        type: integer
        format: int32

  GroupMemberInput:
    type: object
    description: An existing friend by id, or a new placeholder friend by name.
    properties:
      userId:
        type: string
        format: uuid
      displayName:
        type: string
        minLength: 1
        maxLength: 64

  GroupInput:
    type: object
    required: [name, members]
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 64
      members:
        type: array
        maxItems: 50
        description: Everyone besides the caller.
        items:
          $ref: '#/schemas/GroupMemberInput'
      archived:
        type: boolean
        description: Archive or unarchive (ignored when creating).

  GroupExpenses:
    type: object
    required: [group, expenses]
    properties:
      group:
        $ref: '#/schemas/Group'
      expenses:
        type: array
        items:
          $ref: './friends.yaml#/schemas/SharedExpense'
