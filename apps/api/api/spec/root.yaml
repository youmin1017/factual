# The API spec's entry point (ADR-113). Each domain's paths and schemas live in
# its own file next to this one; this file lists every path and points at its
# definition. `mise run gen` bundles them into ../openapi.yaml (generated,
# never edited by hand), which the code generators and the server read.
openapi: 3.0.3
info:
  title: Factual API
  version: 0.5.0
  description: |
    The API is spec-first: these files are the source of truth for the Go
    server (oapi-codegen) and the web client types (openapi-typescript).

    Amounts are integers in the budget's minor unit (minorUnits digits after
    the decimal point; 0 for TWD).

    Access control: every operation declares exactly one `x-auth`:
    `public`, `authenticated` (any logged-in user) or `admin` (instance
    admin). The API does not start otherwise. Operations inside a budget
    also declare `x-budget: read | write | manage`, the permission the
    caller's role in that budget must grant. Errors use the `Error` envelope.
servers:
  - url: /api
tags:
  - name: system
  - name: auth
  - name: ledger
  - name: calendar
  - name: splitting
