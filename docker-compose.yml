# Local development services. Start with `mise run db:up`.
services:
  postgres:
    image: postgres:18
    container_name: factual-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: factual
      POSTGRES_PASSWORD: factual
      POSTGRES_DB: factual
    ports:
      - "${FACTUAL_DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep the data in a versioned subdirectory of this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factual -d factual"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
